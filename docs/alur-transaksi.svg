<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1540" viewBox="0 0 950 1540" role="img" aria-label="Alur proses transaksi pemesanan"><title>Alur proses transaksi pemesanan</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#212529" font-weight="bold" text-anchor="start">Alur Proses Transaksi: dari Memilih Produk hingga Membuat Pesanan</text>
