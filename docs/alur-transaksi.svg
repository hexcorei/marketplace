<text x="450" y="1198.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#212529" font-weight="normal" text-anchor="middle">INSERT order_items (snapshot nama &amp; harga)</text>
<rect x="270.0" y="1240.0" width="360" height="60" rx="8" fill="#d1e7dd" stroke="#198754" stroke-width="1.6"/>
<text x="450" y="1260.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#212529" font-weight="normal" text-anchor="middle">UPDATE products: stok = stok - qty</text>
<text x="450" y="1278.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#212529" font-weight="normal" text-anchor="middle">DELETE cart_items milik pembeli</text>
<rect x="270.0" y="1319.0" width="360" height="42" rx="8" fill="#d1e7dd" stroke="#198754" stroke-width="1.6"/>
<text x="450" y="1339.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#212529" font-weight="normal" text-anchor="middle">COMMIT (semua perubahan disimpan permanen)</text>
<rect x="270.0" y="1380.0" width="360" height="60" rx="8" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1.6"/>
