<text x="450" y="233.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#212529" font-weight="normal" text-anchor="middle">→ halaman Detail Produk</text>
<polygon points="450,277.0 600.0,325 450,373.0 300.0,325" fill="#fff3cd" stroke="#e0a800" stroke-width="1.5"/>
<text x="450" y="316.5" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#212529" font-weight="normal" text-anchor="middle">Sudah login sebagai</text>
