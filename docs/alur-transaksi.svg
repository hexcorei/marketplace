<text x="450" y="438.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#212529" font-weight="normal" text-anchor="middle">&quot;Tambah ke Keranjang&quot; (POST + token CSRF)</text>
<polygon points="450,487.0 600.0,535 450,583.0 300.0,535" fill="#fff3cd" stroke="#e0a800" stroke-width="1.5"/>
<text x="450" y="526.5" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#212529" font-weight="normal" text-anchor="middle">Produk aktif &amp;</text>
<text x="450" y="543.5" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#212529" font-weight="normal" text-anchor="middle">stok mencukupi?</text>
